# ============================================================
# Vaultwarden — 自托管密码管理器 (Bitwarden 兼容)
# 存储所有账号密码、信用卡、笔记等敏感信息
#
# 部署前准备:
#   1. 复制 ./data/config.example.json 为 ./data/config.json
#   2. 在 config.json 中填写域名、管理密码和 SMTP 信息
#   3. domain 必须与 Nginx 反代的 HTTPS 域名完全一致
#   4. /admin 管理后台只应通过 HTTPS 访问，不要直接暴露到公网
#   5. 数据持久化在 ./data，务必定期备份！
#
# 启动:      docker compose up -d
# 访问:      http://host:80（应通过 nginx HTTPS 反代访问）
# ============================================================

name: vaultwarden

services:
  vaultwarden:
    image: vaultwarden/server:latest
    container_name: vaultwarden
    network_mode: bridge
    restart: unless-stopped
    init: true

    ports:
      - "80:80"

    volumes:
      # 数据库、附件和主配置文件 config.json 均保存在此目录。
      # config.json 可能包含管理密码和 SMTP 授权码，不要提交实际文件。
      - ./data:/data
      # 随模板附带的 Asia/Shanghai 时区文件
      - ./localtime:/etc/localtime:ro

    security_opt:
      - no-new-privileges:true

    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

    mem_limit: 512m
    cpus: 1.0
    pids_limit: 256
    stop_grace_period: 30s
