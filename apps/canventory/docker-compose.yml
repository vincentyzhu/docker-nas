# ============================================================
# Canventory — 冰箱食品库存与到期提醒
#
# 部署前：
#   1. 修改 SECRET_KEY，并保持投入使用后的值不变
#   2. 编辑 ./notify/config.yml 中的 NAS_IP、网页域名、账号和钉钉机器人配置
#   3. 通用通知镜像默认从 GHCR 拉取；离线导入时改为 nas-notifier:local
#
# 当前使用 Canventory 官方镜像，不包含中文、数量单位和保质期换算二次开发。
# 后续若发布二次开发镜像，只需替换下面的 image，数据目录可以继续使用。
#
# 端口：8000 — Canventory Web UI/API（公开模板使用默认端口直接映射）
# ============================================================

name: canventory

services:
  canventory:
    image: elthamini/canventory:latest
    container_name: canventory
    network_mode: bridge
    restart: unless-stopped
    init: true

    ports:
      - "8000:8000"

    environment:
      TZ: Asia/Shanghai
      # 外部访问地址；使用反向代理时改为实际 HTTPS 域名。
      APP_URL: "http://NAS_IP:8000"
      DATABASE_URL: "sqlite+aiosqlite:////app/data/canventory.db"
      # 必填：生成随机长字符串，投入使用后不要随意修改。
      SECRET_KEY: "CHANGE-ME-REPLACE-WITH-A-RANDOM-SECRET"
      DEBUG: "false"
      SMTP_ENABLED: "false"
      IMAGE_STORAGE: filesystem
      IMAGE_UPLOAD_DIR: /app/data/uploads/images
      EXPIRATION_WARNING_DAYS: "7"
      EXPIRATION_CRITICAL_DAYS: "3"
      CHECK_EXPIRATION_INTERVAL_HOURS: "24"

    volumes:
      # SQLite 数据库和上传图片都保存在此目录，必须纳入备份。
      - ./data:/app/data

    security_opt:
      - no-new-privileges:true

    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

    mem_limit: 256m
    cpus: 0.5
    pids_limit: 100
    stop_grace_period: 30s

  notify:
    # 若已离线导入镜像，可改为 nas-notifier:local。
    image: ghcr.io/vincentyzhu/nas-notifier:latest
    container_name: canventory-notify
    network_mode: bridge
    restart: unless-stopped
    init: true

    depends_on:
      - canventory

    environment:
      CONFIG_FILE: /config/config.yml

    volumes:
      # 必须预先存在且是文件，否则部分 Docker 管理界面会创建成目录。
      - ./notify/config.yml:/config/config.yml:ro

    security_opt:
      - no-new-privileges:true

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "2"

    mem_limit: 128m
    cpus: 0.3
    pids_limit: 64
    stop_grace_period: 30s
