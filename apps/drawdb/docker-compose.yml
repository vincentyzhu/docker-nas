# ============================================================
# drawdb — 在线数据库关系图编辑器
# 可视化设计数据库 Schema，支持导出 SQL
#
# 部署前准备: 无需额外配置
# 启动:      docker compose up -d
# 访问:      http://host:80
# ============================================================

name: drawdb

services:
  drawdb:
    image: ghcr.io/drawdb-io/drawdb:latest
    container_name: drawdb
    network_mode: bridge
    restart: unless-stopped
    init: true

    ports:
      - "80:80"

    security_opt:
      - no-new-privileges:true

    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

    mem_limit: 128m
    cpus: 0.25
    pids_limit: 128
    stop_grace_period: 15s