# Homebox 通知公开模板。部署前替换所有 CHANGE-ME、NAS_IP 和示例域名。
notifier:
  type: homebox
  timezone: Asia/Shanghai

schedule:
  # 每天执行时间，24 小时制；默认重启不推送，空结果不推送。
  notify_time: "08:00"
  run_on_start: false
  send_empty: false

dingtalk:
  webhook: "CHANGE-ME-DINGTALK-WEBHOOK"
  # 机器人未启用加签时留空。
  secret: ""

http:
  timeout_seconds: 20
  retry_attempts: 3
  retry_delay_seconds: 10

source:
  # 默认 bridge 网络通过 NAS 映射端口访问主服务。
  api_url: "http://NAS_IP:7745"
  # 仅用于通知中的“打开查看”链接，可填写公网 HTTPS 域名。
  web_url: "https://homebox.example.com"
  # 在 Homebox 的“个人资料 -> API Keys”页面创建，不是登录密码。
  api_key: "CHANGE-ME-HOMEBOX-API-KEY"
  # 仅提醒今天和未来 30 天内到期的物品；已经过保的物品不推送。
  remind_days: 30
