# ============================================================
# omni-tools — 全能在线工具集
# 图片处理、编码转换、文本工具等杂项工具合集
#
# 部署前准备: 无需额外配置
# 启动:      docker compose up -d
# 访问:      http://host:80
# ============================================================

name: omni-tools

services:
  omni-tools:
    image: iib0011/omni-tools:latest
    container_name: omni-tools
    network_mode: bridge
    restart: unless-stopped
    init: true

    ports:
      - "80:80"

    security_opt:
      - no-new-privileges:true

    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

    mem_limit: 256m
    cpus: 0.5
    pids_limit: 128
    stop_grace_period: 15s