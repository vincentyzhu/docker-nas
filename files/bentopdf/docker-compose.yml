# ============================================================
# bentopdf — 在线文件格式转换
# 支持 PDF、图片、Office 文档等格式互转，纯浏览器端处理
#
# 部署前准备: 无需额外配置
# 启动:      docker compose up -d
# 访问:      http://host:8080
# ============================================================

name: bentopdf

services:
  bentopdf:
    image: bentopdfteam/bentopdf:latest
    container_name: bentopdf
    network_mode: bridge
    restart: unless-stopped
    init: true

    ports:
      - "8080:8080"

    environment:
      TZ: Asia/Shanghai

    security_opt:
      - no-new-privileges:true

    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

    mem_limit: 1g
    cpus: 1.0
    pids_limit: 256
    stop_grace_period: 30s