# ============================================================
# frpc — FRP 内网穿透客户端
# 将内网服务端口穿透到公网 FRP 服务器，实现外网访问
#
# 部署前准备:
#   1. 复制 .env.example 为 .env，填写公网服务器地址和 Token
#   2. FRP_TOKEN 必须与 frps 服务端保持一致
#   3. 每个需要穿透的服务在 frpc.toml 中添加一个 proxy 配置
#
# 注意: 使用 host 网络模式以直接访问宿主机端口
# 启动:      docker compose up -d
# ============================================================

name: frpc

services:
  frpc:
    # Docker Hub 仓库没有 latest 标签，客户端和服务端保持相同版本。
    image: fatedier/frpc:v0.71.0
    container_name: frpc
    restart: unless-stopped
    init: true

    environment:
      FRP_SERVER_ADDR: "${FRP_SERVER_ADDR:?请复制 .env.example 为 .env 并填写 FRP_SERVER_ADDR}"
      FRP_TOKEN: "${FRP_TOKEN:?请填写 FRP_TOKEN}"

    # 直接使用 NAS 宿主机网络
    network_mode: host

    volumes:
      - ./frpc.toml:/etc/frp/frpc.toml:ro

    command:
      - -c
      - /etc/frp/frpc.toml

    security_opt:
      - no-new-privileges:true

    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

    mem_limit: 128m
    cpus: 0.5
    pids_limit: 128
    stop_grace_period: 30s
