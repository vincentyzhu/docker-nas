# ============================================================
# mihomo + metacubexd — 代理工具 + Web 管理面板
# mihomo: Clash Meta 内核，负责代理规则和流量转发
# metacubexd: Web 管理面板，可视化配置和管理
#
# 部署前准备:
#   1. 将 mihomo 配置文件放入 ./config/ 目录
#   2. 填写下方 DEFAULT_BACKEND_URL（mihomo API 地址）
#   3. 两个容器共享同一个 x-common 配置块
#
# 端口说明:
#   7897 — HTTP 代理端口
#   9090 — mihomo API / 面板后端
#   80   — metacubexd Web 面板
#
# 启动:      docker compose up -d
# 访问:      http://host:80 (管理面板)
# ============================================================

name: mihomo

x-common: &common
  restart: unless-stopped
  init: true
  logging:
    driver: json-file
    options:
      max-size: "20m"
      max-file: "3"

services:
  mihomo:
    <<: *common
    container_name: mihomo
    image: metacubex/mihomo:latest
    network_mode: bridge
    environment:
      TZ: Asia/Shanghai
    volumes:
      - ./config:/root/.config/mihomo
    ports:
      - "7897:7897"
      - "9090:9090"
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    cpus: 1.0
    pids_limit: 256
    stop_grace_period: 30s

  metacubexd:
    <<: *common
    container_name: metacubexd
    image: ghcr.io/metacubex/metacubexd:latest
    network_mode: bridge
    depends_on:
      - mihomo
    ports:
      - "80:80"
    environment:
      TZ: Asia/Shanghai
      # mihomo API 地址 — 替换为实际值，例如 http://mihomo:9090
      DEFAULT_BACKEND_URL: 
    security_opt:
      - no-new-privileges:true
    mem_limit: 64m
    cpus: 0.25
    pids_limit: 128
    stop_grace_period: 30s
