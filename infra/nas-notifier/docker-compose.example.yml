name: nas-notifier

# 同一个镜像启动三个独立实例；每个实例只挂载自己的配置文件。
services:
  canventory-notify:
    image: nas-notifier:local
    container_name: canventory-notify
    network_mode: bridge
    restart: unless-stopped
    init: true
    environment:
      CONFIG_FILE: /config/config.yml
    volumes:
      - ./config/canventory.yml:/config/config.yml:ro
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "2"
    mem_limit: 128m
    cpus: 0.3
    pids_limit: 64
    stop_grace_period: 30s

  homebox-notify:
    image: nas-notifier:local
    container_name: homebox-notify
    network_mode: bridge
    restart: unless-stopped
    init: true
    environment:
      CONFIG_FILE: /config/config.yml
    volumes:
      - ./config/homebox.yml:/config/config.yml:ro
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "2"
    mem_limit: 128m
    cpus: 0.3
    pids_limit: 64
    stop_grace_period: 30s

  frigate-notify:
    image: nas-notifier:local
    container_name: frigate-notify
    network_mode: bridge
    restart: unless-stopped
    init: true
    environment:
      CONFIG_FILE: /config/config.yml
    volumes:
      - ./config/frigate.yml:/config/config.yml:ro
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "2"
    mem_limit: 128m
    cpus: 0.3
    pids_limit: 64
    stop_grace_period: 30s
