# 复制为 canventory.yml 后填写真实信息。
notifier:
  type: canventory
  timezone: Asia/Shanghai

schedule:
  # 每天执行时间，24 小时制。
  notify_time: "08:00"
  # false：容器启动或重启时不立即推送。
  run_on_start: false
  # false：没有临期物品时保持安静。
  send_empty: false

dingtalk:
  webhook: "CHANGE-ME-DINGTALK-WEBHOOK"
  # 机器人没有启用“加签”时留空。
  secret: ""

http:
  timeout_seconds: 20
  retry_attempts: 3
  retry_delay_seconds: 10

source:
  # 通知容器通过 NAS 局域网地址访问 Canventory API。
  api_url: "http://NAS_IP:8000"
  # 钉钉消息中的网页入口，可以使用公网域名。
  web_url: "https://canventory.example.com"
  username: "notifier"
  password: "CHANGE-ME-CANVENTORY-PASSWORD"
