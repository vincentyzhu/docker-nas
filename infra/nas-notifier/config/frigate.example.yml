# 复制为 frigate.yml 后填写真实信息。
notifier:
  type: frigate
  # 支持 dingtalk（钉钉）或 wecom（企业微信）。
  channel: dingtalk
  timezone: Asia/Shanghai

# 仅在中国法定工作日的指定时段发送；调休周末按工作日处理。
notification_policy:
  enabled: true
  calendar: china_workdays
  time_ranges:
    - start: "09:00"
      end: "18:00"

dingtalk:
  webhook: "CHANGE-ME-DINGTALK-WEBHOOK"
  secret: ""

wecom:
  # 企业微信群“自定义消息推送”的完整 Webhook 地址。
  webhook: "CHANGE-ME-WECOM-WEBHOOK"

http:
  timeout_seconds: 20
  retry_attempts: 3
  retry_delay_seconds: 10

source:
  web_url: "https://frigate.example.com"

  # 空列表表示监听所有摄像头。
  watch_cameras: []
  watch_labels:
    - person
  event_types:
    - new

  # 0 表示不启用冷却，每个符合条件的新事件都推送。
  cooldown_seconds: 0

  # 可将 Frigate 内部名称映射为通知中显示的中文名称。
  camera_names:
    front_door: 前门
  label_names:
    person: 人员

  mqtt:
    # 当前所有容器均为默认 bridge，因此从 NAS 映射端口访问。
    host: "NAS_IP"
    port: 1883
    topic_prefix: frigate
    # 如需覆盖完整主题可取消下一行注释。
    # topic: frigate/events
    client_id: nas-notifier-frigate
    username: ""
    password: ""
    tls: false
    keepalive: 60
