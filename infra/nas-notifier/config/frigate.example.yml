# 复制为 frigate.yml 后填写真实信息。
notifier:
  type: frigate
  timezone: Asia/Shanghai

dingtalk:
  webhook: "CHANGE-ME-DINGTALK-WEBHOOK"
  secret: ""

http:
  timeout_seconds: 20
  retry_attempts: 3
  retry_delay_seconds: 10

source:
  web_url: "https://frigate.example.com"

  # 空列表表示监听所有摄像头。
  watch_cameras: []
  watch_labels:
    - person
    - car
    - dog
    - cat
  event_types:
    - new

  # 0 表示不启用冷却，每个符合条件的新事件都推送。
  cooldown_seconds: 0

  # 可将 Frigate 内部名称映射为通知中显示的中文名称。
  camera_names:
    front_door: 前门
  label_names:
    person: 人员
    car: 车辆
    dog: 狗
    cat: 猫

  mqtt:
    # 当前所有容器均为默认 bridge，因此从 NAS 映射端口访问。
    host: "NAS_IP"
    port: 1883
    topic_prefix: frigate
    # 如需覆盖完整主题可取消下一行注释。
    # topic: frigate/events
    client_id: nas-notifier-frigate
    username: ""
    password: ""
    tls: false
    keepalive: 60
