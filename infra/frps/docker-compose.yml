# ============================================================
# frps — FRP 内网穿透服务端（公网服务器）
# 接收内网 frpc 客户端的穿透请求，对外提供端口映射
#
# 部署前准备:
#   1. 复制 .env.example 为 .env，填写 Token 和面板登录凭证
#   2. 按需修改 frps.toml 中的 allowPorts 端口范围
#   3. FRPS_TOKEN 必须与 frpc 客户端保持一致
#
# 注意: 使用 host 网络模式，直接监听宿主机端口
#   - bindPort 6111: frpc 客户端连接端口
#   - webServer 6001: 面板端口（仅监听本机，由 Nginx 反代对外）
#
# 启动:      docker compose up -d
# ============================================================

name: frps

services:
  frps:
    # Docker Hub 仓库没有 latest 标签，客户端和服务端保持相同版本。
    image: fatedier/frps:v0.71.0
    container_name: frps
    network_mode: host
    restart: unless-stopped
    init: true

    environment:
      FRPS_TOKEN: "${FRPS_TOKEN:?请复制 .env.example 为 .env 并填写 FRPS_TOKEN}"
      FRPS_DASHBOARD_USER: "${FRPS_DASHBOARD_USER:?请填写 FRPS_DASHBOARD_USER}"
      FRPS_DASHBOARD_PASSWORD: "${FRPS_DASHBOARD_PASSWORD:?请填写 FRPS_DASHBOARD_PASSWORD}"

    volumes:
      - ./frps.toml:/etc/frp/frps.toml:ro

    command:
      - -c
      - /etc/frp/frps.toml

    security_opt:
      - no-new-privileges:true

    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

    mem_limit: 128m
    cpus: 0.5
    pids_limit: 128
    stop_grace_period: 30s
