# ============================================================
# WUD (What's Up Docker) — Docker 镜像更新检测与机器人通知
#
# 默认通知方式：钉钉自定义机器人（Command Trigger，批量模式）。
# 可切换为企业微信群机器人；SMTP 邮件可独立启用。
#
# 部署前准备：
#   1. 复制 .env.example 为 .env，并填写通知通道、机器人和登录配置。
#   2. 保持 dingtalk-notify.sh 与本文件位于同一目录。
#   3. 执行 docker compose config --quiet 检查配置，再启动服务。
#
# 镜像策略：getwud/wud:9 持续跟随 9.x 更新，不自动跨越到 10.x。
#
# 启动：docker compose up -d
# 访问：http://host:3000
# ============================================================

name: wud

services:
  wud:
    image: getwud/wud:9
    container_name: wud
    network_mode: bridge
    restart: unless-stopped
    init: true

    ports:
      # 公开模板保持默认端口直接映射；复制到 NAS 后可修改宿主机端口。
      - "3000:3000"

    volumes:
      # WUD 需要读取 Docker 状态；即使只读挂载，docker.sock 仍具有较高权限。
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./store:/store
      - ./dingtalk-notify.sh:/scripts/dingtalk-notify.sh:ro

    environment:
      TZ: Asia/Shanghai

      # Docker 本机监控
      WUD_WATCHER_LOCAL_SOCKET: /var/run/docker.sock
      WUD_WATCHER_LOCAL_WATCHBYDEFAULT: "true"
      WUD_LOG_LEVEL: warn
      # 每日 10:00 扫描一次（使用上方 TZ 时区）。
      WUD_WATCHER_LOCAL_CRON: "0 10 * * *"

      # ---------- 机器人通知（默认钉钉，可切换企业微信） ----------
      WUD_TRIGGER_COMMAND_DINGTALK_CMD: /scripts/dingtalk-notify.sh
      WUD_TRIGGER_COMMAND_DINGTALK_SHELL: /bin/sh
      WUD_TRIGGER_COMMAND_DINGTALK_MODE: batch
      WUD_TRIGGER_COMMAND_DINGTALK_THRESHOLD: all
      # 企业微信长消息可能拆分为多条并分别重试，因此预留 5 分钟。
      WUD_TRIGGER_COMMAND_DINGTALK_TIMEOUT: "300000"

      NOTIFY_CHANNEL: "${NOTIFY_CHANNEL:-dingtalk}"

      # 未选中的通道可留空，由通知脚本校验所选通道的必填项。
      DINGTALK_WEBHOOK: "${DINGTALK_WEBHOOK:-}"
      DINGTALK_SECRET: "${DINGTALK_SECRET:-}"
      DINGTALK_MAX_ATTEMPTS: "${DINGTALK_MAX_ATTEMPTS:-3}"
      DINGTALK_RETRY_DELAY_SECONDS: "${DINGTALK_RETRY_DELAY_SECONDS:-5}"

      WECOM_WEBHOOK: "${WECOM_WEBHOOK:-}"
      WECOM_MAX_ATTEMPTS: "${WECOM_MAX_ATTEMPTS:-3}"
      WECOM_RETRY_DELAY_SECONDS: "${WECOM_RETRY_DELAY_SECONDS:-5}"

      # ---------- Web 管理员登录（9.x 强制认证） ----------
      # PASSWORD 填写实际密码，由 WUD 哈希后写入数据库。
      WUD_AUTH_ADMIN_USER: "${WUD_AUTH_ADMIN_USER:?请填写 WUD_AUTH_ADMIN_USER}"
      WUD_AUTH_ADMIN_PASSWORD: "${WUD_AUTH_ADMIN_PASSWORD:?请填写 WUD_AUTH_ADMIN_PASSWORD}"

      # ---------- SMTP 邮件通知（可选，默认关闭） ----------
      # 如需使用，先在 .env 填写 WUD_SMTP_*，再取消以下配置的注释。
      # QQ 邮箱 465 端口使用隐式 TLS；PASS 应填写 SMTP 授权码，而非 QQ 密码。
      # WUD_TRIGGER_SMTP_QQ_HOST: smtp.qq.com
      # WUD_TRIGGER_SMTP_QQ_PORT: "465"
      # WUD_TRIGGER_SMTP_QQ_TLS_ENABLED: "true"
      # WUD_TRIGGER_SMTP_QQ_USER: "${WUD_SMTP_USER}"
      # WUD_TRIGGER_SMTP_QQ_PASS: "${WUD_SMTP_PASS}"
      # WUD_TRIGGER_SMTP_QQ_FROM_ADDRESS: "${WUD_SMTP_FROM}"
      # WUD_TRIGGER_SMTP_QQ_TO: "${WUD_SMTP_TO}"
      # WUD_TRIGGER_SMTP_QQ_SIMPLETITLE: "WUD: $${container.name} 有可用更新"
      # WUD_TRIGGER_SMTP_QQ_SIMPLEBODY: |
      #   容器 $${container.name} 有新版本
      #   当前版本：$${container.updateKind.localValue}
      #   最新版本：$${container.updateKind.remoteValue}

    security_opt:
      - no-new-privileges:true

    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

    mem_limit: 512m
    cpus: 0.5
    pids_limit: 128
    stop_grace_period: 30s
