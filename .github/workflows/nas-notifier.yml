name: 构建 nas-notifier 镜像

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "infra/nas-notifier/**"
      - ".github/workflows/nas-notifier.yml"

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/nas-notifier

jobs:
  test:
    name: 运行单元测试
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/nas-notifier
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: infra/nas-notifier/requirements.txt

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 执行测试
        run: python -m unittest discover -s tests -v

  publish:
    name: 构建并发布多架构镜像
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 启用 QEMU
        uses: docker/setup-qemu-action@v3

      - name: 配置 Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 生成镜像标签
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha

      - name: 构建并推送
        uses: docker/build-push-action@v6
        with:
          context: ./infra/nas-notifier
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
