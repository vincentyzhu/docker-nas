# ============================================================
# jisuxiang（极速箱）— 在线文件传输/分享工具
# 支持拖拽上传、生成分享链接、设置密码和过期时间
#
# 部署前准备: 无需额外配置
# 启动:      docker compose up -d
# 访问:      http://host:3000
# ============================================================

name: jisuxiang

services:
  jisuxiang:
    image: star7th/jisuxiang:latest
    container_name: jisuxiang
    network_mode: bridge
    restart: unless-stopped
    init: true

    ports:
      - "3000:3000"

    security_opt:
      - no-new-privileges:true

    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

    mem_limit: 256m
    cpus: 0.5
    pids_limit: 128
    stop_grace_period: 30s