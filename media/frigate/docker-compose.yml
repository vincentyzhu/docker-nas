# ============================================================
# Frigate — 本地 AI 视频监控 NVR（含 MQTT + 钉钉通知）
#
# 本 compose 包含三个服务:
#   frigate        — AI 视频监控核心（检测/录像/推流）
#   mosquitto      — MQTT 消息代理（Frigate 事件总线）
#   frigate-notify — 钉钉告警通知（监听 MQTT 事件）
#
# 硬件要求:
#   - Intel 核显 (Quick Sync) 用于 AI 推理加速
#   - 摄像头需支持 RTSP 协议
#
# 部署前准备:
#   1. 在 ./config/config.yml 中配置摄像头 RTSP 地址
#   2. 在 ./notify/config.yml 中填写 MQTT、网页域名和钉钉机器人配置
#   3. 确保 /dev/dri/renderD128 设备存在（核显直通），否则删除 devices 和 privileged
#   4. 默认 bridge 网络不能使用 Compose 服务名解析，通知容器通过 NAS_IP:1883 访问 MQTT
#
# 安全提醒: 当前 Mosquitto 允许匿名访问，仅应在可信局域网使用，不要映射到公网。
#
# 端口说明:
#   8971 — Frigate Web UI
#   5000 — Frigate 推流/API
#   8554 — go2rtc WebRTC
#   8555 — go2rtc 信令
#
# 启动:      docker compose up -d（自动按 mosquitto → frigate → notify 顺序启动）
# 访问:      http://host:8971
# ============================================================

name: frigate

services:
  frigate:
    image: ghcr.io/blakeblackshear/frigate:0.17.2
    container_name: frigate
    network_mode: bridge
    restart: unless-stopped
    # 不要为 Frigate 核心服务启用 init: true；当前镜像在现有部署环境中
    # 会因此出现启动进程被接管、核心服务无法正常启动的问题。
    privileged: true
    stop_grace_period: 30s
    shm_size: "512mb"

    depends_on:
      - mosquitto

    devices:
      - /dev/dri/renderD128:/dev/dri/renderD128

    ports:
      - "8971:8971"
      - "5000:5000"
      # go2rtc
      - "8554:8554"
      - "8555:8555/tcp"
      - "8555:8555/udp"

    environment:
      TZ: Asia/Shanghai

    security_opt:
      - no-new-privileges:true

    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

    mem_limit: 2g
    cpus: 2.0
    pids_limit: 512

    volumes:
      # 随模板附带的 Asia/Shanghai 时区文件
      - ./localtime:/etc/localtime:ro
      - ./config:/config
      # 录像存储目录 — 挂载实际存储路径
      - ./storage:/media/frigate
      # 缓存目录
    tmpfs:
      - /tmp/cache:size=1000000000

  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: mosquitto
    network_mode: bridge
    restart: unless-stopped
    init: true

    ports:
      - "1883:1883"

    environment:
      TZ: Asia/Shanghai

    security_opt:
      - no-new-privileges:true

    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

    mem_limit: 128m
    cpus: 0.5
    pids_limit: 128
    stop_grace_period: 30s

    volumes:
      - ./mqtt/config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./mqtt/data:/mosquitto/data

  notify:
    # 若已离线导入镜像，可改为 nas-notifier:local。
    image: ghcr.io/vincentyzhu/nas-notifier:latest
    container_name: frigate-notify
    network_mode: bridge
    restart: unless-stopped
    init: true

    depends_on:
      - mosquitto
      - frigate

    environment:
      CONFIG_FILE: /config/config.yml

    volumes:
      - ./notify/config.yml:/config/config.yml:ro

    security_opt:
      - no-new-privileges:true

    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

    mem_limit: 128m
    cpus: 0.3
    pids_limit: 64
    stop_grace_period: 30s
